name: CI

on:
  pull_request:
    # ready_for_review: taking over the flake updater's draft runs CI.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate hosts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      # Instantiating each system catches what `nix flake check` misses, such
      # as a package nixpkgs no longer has. Nothing is built.
      - name: Evaluate every host
        run: >-
          nix eval --json --accept-flake-config --no-update-lock-file
          .#nixosConfigurations
          --apply 'builtins.mapAttrs (_: host: host.config.system.build.toplevel.drvPath)'
