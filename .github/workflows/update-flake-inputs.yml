name: Update flake inputs

on:
  schedule:
    - cron: "0 9 * * 0" # Sundays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake-inputs

jobs:
  update:
    name: Update and evaluate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    defaults:
      run:
        shell: bash
    env:
      BRANCH: update/flake-inputs
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      - name: Update the inputs
        id: update
        run: |
          # Move the Pi release pin to nvmd's newest stable release, never backwards.
          tag='v[0-9]+\.[0-9]{8}\.[0-9]+'
          current=$(grep -oE "nvmd/nixos-raspberrypi/$tag\"" flake.nix | grep -oE "$tag") ||
            { echo "::error::flake.nix doesn't pin nixos-raspberrypi to a release tag"; exit 1; }
          latest=$(gh release list --repo nvmd/nixos-raspberrypi --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' | grep -xE "$tag" | sort -V | tail -n1)
          title="Update flake inputs"
          release="Raspberry Pi release: $current (unchanged)."
          if [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -n1)" != "$current" ]; then
            sed -i "s|nvmd/nixos-raspberrypi/$current\"|nvmd/nixos-raspberrypi/$latest\"|" flake.nix
            title="Update nixos-raspberrypi to $latest and other flake inputs"
            release="Raspberry Pi release: $current → $latest."
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

          nix flake update --accept-flake-config 2>&1 | tee "$RUNNER_TEMP/update.log"

          changes=$(grep -v '^warning: updating lock file' "$RUNNER_TEMP/update.log" | sed -E "s/\?narHash=[^']*//" || true)
          cat > "$RUNNER_TEMP/body.md" <<EOF
          $release

          ~~~
          $changes
          ~~~

          The **Nix evaluation** status shows whether every host still evaluates and links to [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for any errors. Evaluation builds nothing: build the affected hosts and test them on a Pi before merging.

          The weekly flake updater owns this draft and rewrites it on each run. Mark it ready for review to take it over: the updater then leaves it alone, and CI runs. GitHub's *Approve workflows to run* prompt is optional; approving it just runs CI sooner.
          EOF

      # The PR opens even when a host fails to evaluate; its status says so.
      - name: Evaluate every host
        id: evaluate
        continue-on-error: true
        run: >-
          nix eval --json --accept-flake-config --no-update-lock-file
          .#nixosConfigurations
          --apply 'builtins.mapAttrs (_: host: host.config.system.build.toplevel.drvPath)'

      - name: Check whether the update PR has been taken over
        id: owner
        run: |
          taken=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json isDraft --jq 'any(.[]; .isDraft | not)')
          echo "taken=$taken" >> "$GITHUB_OUTPUT"
          if [ "$taken" = true ]; then
            echo "::notice::The update PR is ready for review, so it's yours; this run leaves it alone."
          fi

      - name: Open or refresh the draft PR
        id: pr
        if: steps.owner.outputs.taken == 'false'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.BRANCH }}
          delete-branch: true
          draft: always-true
          add-paths: |
            flake.nix
            flake.lock
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          body-path: ${{ runner.temp }}/body.md

      - name: Report the evaluation on the PR
        if: steps.pr.outputs.pull-request-number
        env:
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          STATE: ${{ steps.evaluate.outcome }}
        run: |
          if [ "$STATE" = success ]; then summary="Every host evaluates"; else summary="A host fails to evaluate"; fi
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" -f context="Nix evaluation" -f description="$summary" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
