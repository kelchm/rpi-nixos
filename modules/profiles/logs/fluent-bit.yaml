# Sends this Pi's journal, kernel messages included, to VictoriaLogs through
# the ingest endpoint, which stamps host.name, service.namespace and the stream
# fields from the host's token. Adapted from home-lab's
# proxmox/monitoring/logs/fluent-bit.yaml, differing only where the Pi forces
# it: the journal, cursor and buffer live in RAM, and the token comes from a
# systemd credential. host.lua is a byte-identical copy of home-lab's. See
# "Host logs" in home-lab's docs/runbooks/logging.md.
# Fluent Bit reads the token only when it starts; see "Rotate a token" in
# home-lab's docs/runbooks/host-monitoring.md.
env:
  - name: INGEST_TOKEN
    uri: file:///run/credentials/fluent-bit.service/metrics-ingest-token

service:
  flush: 5
  grace: 30
  log_level: warn
  http_server: on
  http_listen: 127.0.0.1
  http_port: 2020
  # The service's RuntimeDirectory, on tmpfs like the journal, so the buffer
  # and cursor never touch the SD card.
  storage.path: /run/fluent-bit/storage
  storage.sync: full
  storage.checksum: off
  storage.metrics: on
  # As the cluster's collector: retry at least every 30 seconds, and keep the
  # backlog well inside the service's memory limit.
  scheduler.cap: 30
  storage.max_chunks_up: 16
  storage.backlog.mem_limit: 16M

pipeline:
  inputs:
    # Reads only the RAM journal; journals from before it moved to RAM are
    # still on some SD cards. The cursor is in RAM too, so it resets with the
    # journal at boot: reading from the head then sends the whole boot, and a
    # restart or redeploy resumes from the saved cursor.
    - name: systemd
      alias: journal
      tag: journal
      path: /run/log/journal
      db: /run/fluent-bit/journal.db
      db.sync: full
      read_from_tail: off
      storage.type: filesystem

  filters:
    - name: lua
      match: journal
      script: host.lua
      call: normalize
      type_int_key: severity_number process.pid

  outputs:
    - name: opentelemetry
      alias: ingest
      match: journal
      host: metrics-ingest.home.kelch.io
      port: 443
      tls: on
      tls.verify: on
      tls.verify_hostname: on
      logs_uri: /insert/opentelemetry/v1/logs
      header:
        - Authorization Bearer ${INGEST_TOKEN}
        - VL-Ignore-Fields scope.name,scope.version
      logs_body_key: $body
      logs_body_key_attributes: off
      retry_limit: no_limits
      # RAM, as much as journald itself keeps; days of backlog at the Pis'
      # measured rates.
      storage.total_limit_size: 16M
